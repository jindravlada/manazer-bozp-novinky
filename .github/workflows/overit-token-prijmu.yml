name: Ověřit token příjmu

# Ruční bezpečnostní zkouška secretu PRIJEM_READ_TOKEN.
# Před prvním spuštěním se kontroluje celý soubor. Na GitHub se neodesílá,
# dokud kontrola neprojde. Plán, publikace ani Pages sem nepatří.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overit:
    runs-on: ubuntu-latest
    environment: prijem-cteni
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Ověřit čtení a zákaz zápisu
        env:
          PRIJEM_READ_TOKEN: ${{ secrets.PRIJEM_READ_TOKEN }}
        run: python3 nastroje/overit_token_prijmu.py
