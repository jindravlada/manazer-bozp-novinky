name: Ověřit zkušební příjem

# Ruční čtení jedné zkušební větve. Nezapisuje, nepublikuje
# a nespouští se samo. Cesta, větev i otisk jsou pevně v kódu.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overit:
    runs-on: ubuntu-latest
    environment: prijem-cteni
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Ověřit zkušební JSON
        env:
          PRIJEM_READ_TOKEN: ${{ secrets.PRIJEM_READ_TOKEN }}
        run: python3 nastroje/overit_vzdaleny_prijem.py --zkouska
