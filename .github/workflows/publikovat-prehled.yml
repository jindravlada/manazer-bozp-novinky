name: Publikovat fiktivní přehled

# Plán je pondělí 8:15 v Europe/Prague. Osmá hodina nepadá do přechodu
# CET/CEST. Minuta 15 snižuje riziko, že GitHub úlohu na začátku hodiny zahodí.
# Když by se časové pásmo ignorovalo, stejný cron znamená pondělí 8:15 UTC,
# tedy až po 8:00 českého času.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"
      timezone: Europe/Prague

permissions:
  contents: read

# Další běh čeká, dokud neskončí předchozí. Rozpracovaný běh se neruší,
# aby se commit a nasazení neroztrhly.
concurrency:
  group: novinky-pages
  cancel-in-progress: false

jobs:
  publikovat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Vytvořit chybějící fiktivní přehled
        run: python3 nastroje/generuj_prehled.py --root .

      - name: Ověřit kanál
        run: python3 nastroje/generuj_prehled.py --root . --check-only

      - name: Sestavit veřejný web
        run: python3 nastroje/generuj_prehled.py --root . --export-site "$RUNNER_TEMP/site"

      - name: Zapsat změny do main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.json index.html prehledy
          if git diff --cached --quiet; then
            echo "Beze změny, commit se nevytvoří."
            exit 0
          fi
          git commit -m "Přidej fiktivní testovací přehled."
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "Souběžná změna main. Zápis se ruší a existující soubory se nepřepisují."
            exit 1
          fi
          git push origin HEAD:main

      - name: Nastavit Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Nahrát web
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  nasadit:
    needs: publikovat
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
